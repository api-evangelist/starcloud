name: Starcloud
description: >-
  Starcloud is developing orbital data centers that run AI and high-performance
  compute in space. The company aims to deploy hyperscale, gigawatt-scale
  infrastructure in orbit, using continuous solar energy without batteries and
  radiative cooling into the vacuum to lower cost, scale beyond terrestrial
  siting and permitting limits, and deploy rapidly. Backed by Nvidia, Sequoia,
  Andreessen Horowitz, NFX and others, Starcloud is building a roadmap of
  Starcloud-1 through Starcloud-4 satellite compute platforms. As of this
  profile the company exposes no public API, SDK, developer portal, or technical
  documentation surface; it is tracked in the API Evangelist network as a
  space-compute infrastructure company and lead for future enrichment.
